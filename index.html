<!DOCTYPE html>
<html lang="da">
<head>
<link rel="apple-touch-icon" href="icon192.png">
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CNC PRO Tool</title>

<style>
body {font-family:Arial; margin:0; background:#f5f5f5;}
.header {background:#0366d6; color:white; padding:10px; text-align:center;}
.container {max-width:500px; margin:auto; padding:10px;}
.tabs {display:flex; gap:5px; margin-bottom:10px;}
button {flex:1; padding:10px;}
input,select {width:100%; padding:10px; margin-bottom:8px;}
.result {background:#eee; padding:10px;}
.hide {display:none;}
.code {padding:8px; border-bottom:1px solid #ddd; cursor:pointer;}
canvas {background:white; margin-top:10px; border-radius:4px;}
</style>
</head>

<body>

<div class="header">
<h2>CNC PRO</h2>
</div>

<div class="container">

<div class="tabs">
<button onclick="showTab('calc')">Calc</button>
<button onclick="showTab('zero')">Zero</button>
<button onclick="showTab('g')">G/M</button>
<button onclick="showTab('anilam')">Anilam</button>
<button onclick="showTab('tri')">Trekant</button>
</div>

<!-- CALC -->
<div id="calc">
<input id="diameter" value="10">
<input id="vc" value="100">
<input id="teeth" value="4">
<input id="fz" value="0.05">

<div class="result">
RPM: <span id="rpm"></span><br>
Feed: <span id="feed"></span>
</div>
</div>

<!-- ZERO -->
<div id="zero" class="hide">
<input id="m1" placeholder="Måling 1">
<input id="m2" placeholder="Måling 2">

<button onclick="calcZero()">Beregn</button>

<div class="result">
Nul: <span id="zeroRes"></span>
</div>

<div id="zeroHistory"></div>
</div>

<!-- G/M -->
<div id="g" class="hide">
<input id="searchG" placeholder="Søg..." onkeyup="showGCodes()">
<div id="glist"></div>
<div id="gdetail" class="result"></div>
</div>

<!-- ANILAM -->
<div id="anilam" class="hide">
<input id="searchA" placeholder="Søg..." onkeyup="showAnilam()">
<div id="alist"></div>
<div id="adetail" class="result"></div>
</div>

<!-- TREKANT -->
<div id="tri" class="hide">

<input id="ta" placeholder="a" oninput="updateTriangle()">
<input id="tb" placeholder="b" oninput="updateTriangle()">
<input id="tc" placeholder="c" oninput="updateTriangle()">
<input id="tA" placeholder="vinkel A" oninput="updateTriangle()">

<div class="result">
a: <span id="ra"></span><br>
b: <span id="rb"></span><br>
c: <span id="rc"></span><br>
A: <span id="rA"></span><br>
B: <span id="rB"></span>
</div>

<canvas id="triCanvas" width="320" height="300"></canvas>

</div>

</div>

<script>

// ---------------- CALC ----------------
setInterval(()=>{
let d=+diameter.value;
let v=+vc.value;
let z=+teeth.value;
let fzv=+fz.value;

if(d && v){
let rpm=Math.round((v*1000)/(Math.PI*d));
let feed=Math.round(rpm*z*fzv);

document.getElementById("rpm").innerText=rpm;
document.getElementById("feed").innerText=feed;
}
},200);

// ---------------- ZERO ----------------
function calcZero(){

if(m1.value===""||m2.value==="") return;

let v1=parseFloat(m1.value);
let v2=parseFloat(m2.value);

let res=((v1+v2)/2).toFixed(3);
zeroRes.innerText=res;

let div=document.createElement("div");
div.innerText=`${v1}+${v2}=${res}`;
zeroHistory.prepend(div);

if(zeroHistory.children.length>10){
zeroHistory.removeChild(zeroHistory.lastChild);
}
}

// ---------------- G CODES ----------------
const gCodes = [

{
code:"G00",
desc:"Rapid",
detail:`Hurtig positionering

Parametre:
X = X position
Y = Y position
Z = Z position

Eksempel:
G00 X100 Y50`
},

{
code:"G01",
desc:"Lineær",
detail:`Feed bevægelse

Parametre:
X,Y,Z = Position
F = Feedrate

Eksempel:
G01 X50 Y0 F200`
},

{
code:"G02",
desc:"Cirkulær CW",
detail:`Cirkel med uret

Parametre:
X,Y = Slutpunkt
I,J = Center offset
F = Feed

Eksempel:
G02 X50 Y0 I25 J0`
},

{
code:"G03",
desc:"Cirkulær CCW",
detail:`Cirkel mod uret

Parametre:
X,Y = Slutpunkt
I,J = Center offset
F = Feed`
},

{
code:"G04",
desc:"Dwell",
detail:`Pause i program

Parametre:
P = Millisekunder

Eksempel:
G04 P2000`
},

{
code:"G28",
desc:"Home",
detail:`Retur til maskine nul

Parametre:
X,Y,Z = akser

Eksempel:
G28 Z0`
},

{
code:"G40",
desc:"Cancel radius",
detail:`Afbryd radius kompensation`
},

{
code:"G41",
desc:"Radius venstre",
detail:`Værktøjs kompensation venstre

Parametre:
D = Radius offset nummer`
},

{
code:"G42",
desc:"Radius højre",
detail:`Værktøjs kompensation højre

Parametre:
D = Radius offset`
},

{
code:"G43",
desc:"Tool length +",
detail:`Værktøjs længde kompensation

Parametre:
H = Offset nummer
Z = Position`
},

{
code:"G49",
desc:"Cancel tool length",
detail:`Sluk længde komp`
},

{
code:"G53",
desc:"Machine coord",
detail:`Bevægelse i maskinens koordinatsystem

Parametre:
X,Y,Z = maskinposition`
},

{
code:"G54",
desc:"Work offset",
detail:`Arbejdskoordinat

Bruges som reference offset`
},

{
code:"G81",
desc:"Boring",
detail:`Standard bore cyklus

Parametre:
X,Y = position
Z = dybde
R = sikker højde
F = feed

Eksempel:
G81 X20 Y20 Z-10 R2 F150`
},

{
code:"G82",
desc:"Boring dwell",
detail:`Boring med pause i bund

Parametre:
X,Y,Z,R,F
P = dwell tid`
},

{
code:"G83",
desc:"Peck boring",
detail:`Trin boring

Parametre:
X,Y,Z = position/dybde
R = retrakt plan
Q = step dybde
F = feed

Eksempel:
G83 Z-20 Q5 R2`
},

{
code:"G84",
desc:"Tapping",
detail:`Gevind cyklus

Parametre:
X,Y,Z = position
R = start plan
F = pitch (meget vigtigt!)`
},

{
code:"G90",
desc:"Absolut",
detail:`Absolut koordinater`
},

{
code:"G91",
desc:"Inkremental",
detail:`Relativ bevægelse`
},

{
code:"G94",
desc:"Feed/min",
detail:`F pr minut`
},

{
code:"G95",
desc:"Feed/rev",
detail:`F pr omdrejning`
}

];


function showGCodes(){
let s=searchG.value.toUpperCase();
glist.innerHTML="";
gCodes.forEach(g=>{
if(s && !g.code.includes(s) && !g.desc.toUpperCase().includes(s)) return;
let d=document.createElement("div");
d.className="code";
d.innerText=g.code+" - "+g.desc;
d.onclick=()=>gdetail.innerText=g.code+" "+g.desc;
glist.appendChild(d);
});
}

// ---------------- ANILAM ----------------
const anilam=[
{code:"V02",desc:"X"},
{code:"V03",desc:"Y"},
{code:"AUX 0003",desc:"Spindel start"}
];

function showAnilam(){
let s=searchA.value.toUpperCase();
alist.innerHTML="";
anilam.forEach(a=>{
if(s && !a.code.includes(s)) return;
let d=document.createElement("div");
d.className="code";
d.innerText=a.code+" - "+a.desc;
d.onclick=()=>adetail.innerText=a.code+" "+a.desc;
alist.appendChild(d);
});
}

// ---------------- TREKANT ----------------
function updateTriangle(){

let a=parseFloat(ta.value);
let b=parseFloat(tb.value);
let c=parseFloat(tc.value);
let A=parseFloat(tA.value);

// reset
ra.innerText="-"; rb.innerText="-"; rc.innerText="-"; rA.innerText="-"; rB.innerText="-";

// beregninger
if(a && b && !c){
c=Math.sqrt(a*a+b*b);
rc.innerText=c.toFixed(3);
}

if(a && b){
let AA=Math.atan(a/b)*(180/Math.PI);
rA.innerText=AA.toFixed(2);
rB.innerText=(90-AA).toFixed(2);
}

if(c && A){
let rad=A*Math.PI/180;
a=Math.sin(rad)*c;
b=Math.cos(rad)*c;
ra.innerText=a.toFixed(3);
rb.innerText=b.toFixed(3);
}

// tegn
if(a && b && c){
drawTriangle(a,b,c);
}
}

function drawTriangle(a,b,c){

let ctx=document.getElementById("triCanvas").getContext("2d");
ctx.clearRect(0,0,320,300);

let A=Math.acos((b*b+c*c-a*a)/(2*b*c))*180/Math.PI;
let B=Math.acos((a*a+c*c-b*b)/(2*a*c))*180/Math.PI;
let C=180-A-B;

let scale=180/Math.max(a,b,c);

let x1=60,y1=250;
let x2=x1+b*scale,y2=y1;
let x3=x1+Math.cos(C*Math.PI/180)*c*scale;
let y3=y1-Math.sin(C*Math.PI/180)*c*scale;

ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.lineTo(x3,y3);
ctx.closePath();
ctx.strokeStyle="#0366d6";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillText(`a=${a.toFixed(1)}`, (x2+x3)/2,(y2+y3)/2);
ctx.fillText(`b=${b.toFixed(1)}`, (x1+x2)/2,y1+15);
ctx.fillText(`c=${c.toFixed(1)}`, (x1+x3)/2,(y1+y3)/2);

ctx.fillStyle="red";
ctx.fillText(A.toFixed(1)+"°",x1-20,y1-10);
ctx.fillText(B.toFixed(1)+"°",x2+5,y2);
ctx.fillText(C.toFixed(1)+"°",x3,y3);
ctx.fillStyle="black";
}

// ---------------- TABS ----------------
function showTab(t){
["calc","zero","g","anilam","tri"].forEach(id=>{
document.getElementById(id).classList.toggle("hide",id!==t);
});
}

// INIT
showGCodes();
showAnilam();

</script>

</body>
</html>
